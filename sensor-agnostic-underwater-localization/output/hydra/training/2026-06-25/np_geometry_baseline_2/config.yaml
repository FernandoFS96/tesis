exp_name: np_geometry_baseline_2
seed: 0
device: auto
training:
  epochs: 500
  batch_size: 16
  lr: 0.0001
  weight_decay: 1.0e-05
  beta: 1.0
  num_workers: 1
model:
  name: ranp
  num_hidden: 128
  rnn_type: lstm
  rnn_layers: 1
  rnn_dropout: 0.0
data:
  data_dir: ../../data/data_random_positions/processed/geometry_split
  normalize_y: false
  ctx_min: 5
  ctx_max: 40
  val_ctx: 20
  ctx_sample_mode: random
wandb:
  enabled: true
  offline: false
  project_name: sensor-agnostic-underwater-localization
  entity: fernandofs
  group_name: ${exp_name}
  run_name: ${model.name}_seed_${seed}
  dev: false
  tags: null
