# =============================================================================
# Main training config for the neural-process geometry baselines.
#
# Run examples:
#   python scripts/train/train_np_geometry.py                # defaults (cnp)
#   python scripts/train/train_np_geometry.py model=anp
#   python scripts/train/train_np_geometry.py model=ranp training.epochs=500
#   python scripts/train/train_np_geometry.py model=anp data.normalize_y=true \
#       data.ctx_sample_mode=first
#   python scripts/train/train_np_geometry.py wandb.enabled=false
# =============================================================================
defaults:
  - _self_
  - dataset: topology_hermite   # which generated dataset (identity: task/method/mode)
  - data: topology             # split view: topology | geometry | within_geometry
  - model: cnp                 # cnp | anp | rcnp | ranp | online_ranp
  - wandb: default
  - experiment: null           # opt-in bundles: `experiment=<name>` (see config/experiment/)

# Experiment identity, used as the wandb group name and to organise outputs.
exp_name: hermite_random_topology

seed: 1
device: auto  # 'auto' -> cuda if available else cpu; or set 'cuda' / 'cpu'

# -----------------------------------------------------------------------------
# Optimisation / training-loop hyperparameters
# -----------------------------------------------------------------------------
training:
  epochs: 2000
  batch_size: 8
  lr: 5.0e-4
  weight_decay: 1.0e-4
  beta: 1.0          # base KL weight (used only by latent models: anp / ranp)
  # Linearly warm the KL weight 0 -> beta over this many epochs (latent models
  # only). A constant full beta from epoch 1 invites posterior collapse; the old
  # converging setup warmed up over 500 epochs. Set 0 to disable (constant beta).
  kl_warmup_epochs: 500
  num_workers: 1
  # Early stopping on validation MAE: stop after this many epochs with no
  # improvement (> early_stop_min_delta). 0/null disables (train the full epochs).
  # The counter shows in the tqdm bar as es=<counter>/<patience>.
  early_stop_patience: 200
  early_stop_min_delta: 0.0



hydra:
  run:
    dir: ${repo_root:}/output/hydra/training/${now:%Y-%m-%d}/${exp_name}/${model.name}_seed_${seed}
  sweep:
    dir: ${repo_root:}/output/hydra/training/${now:%Y-%m-%d}
    subdir: ${exp_name}/${sub_dir_shortener:${hydra:job.override_dirname}, 3, False}/seed_${format:${seed}, '{:02d}'}
  job:
    config:
      override_dirname:
        exclude_keys:
          - seed