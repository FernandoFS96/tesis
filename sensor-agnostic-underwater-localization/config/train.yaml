# Main training config.
#
#   python scripts/train/train_np_geometry.py                      # spatial_cnp on the default dataset
#   python scripts/train/train_np_geometry.py model=pfn
#   python scripts/train/train_np_geometry.py model=ranp training.epochs=500
#   python scripts/train/train_np_geometry.py experiment=topology model=anp
#
# Models: cnp | anp | pfn | rcnp | ranp | online_ranp, and spatial_* variants
# Splits (data=): layout_ood | layout_seen | topology
defaults:
  - _self_
  - dataset: random_hermite_shared   # generated dataset (task / method / mode)
  - data: layout_ood                 # split: layout_ood | layout_seen | topology
  - model: spatial_cnp
  - wandb: default
  - experiment: null                 # optional bundle, see config/experiment/

# Run name, built from the composed choices; override with exp_name=... if needed.
exp_name: ${model.name}_${hydra:runtime.choices.dataset}_${hydra:runtime.choices.data}_${model.num_hidden}_${training.batch_size}_${training.lr}_aug_m${data.trans_aug_m}
seed: 0
device: auto  # cuda if available, else cpu

training:
  epochs: 1000
  batch_size: 128
  lr: 5.0e-5
  weight_decay: 1.0e-4
  # KL weight for the latent models. The KL is normalized to per-point units,
  # so beta=1 is the standard ELBO.
  beta: 1.0
  # Linear KL warmup from 0 to beta over this many epochs (0 disables it).
  kl_warmup_epochs: 100

  num_workers: 4
  # Stop after this many epochs without a validation MAE improvement larger
  # than early_stop_min_delta (0 or null disables early stopping).
  early_stop_patience: 100
  early_stop_min_delta: 0.3


hydra:
  run:
    dir: ${repo_root:}/output/hydra/training/${now:%Y-%m-%d}/${exp_name}/seed_${seed}
  sweep:
    dir: ${repo_root:}/output/hydra/training/${now:%Y-%m-%d}
    subdir: ${exp_name}/${sub_dir_shortener:${hydra:job.override_dirname}, 3, False}/seed_${format:${seed}, '{:02d}'}
  job:
    config:
      override_dirname:
        exclude_keys:
          - seed
