# Attentive CNP (anp.DeterministicModel), without the spatial front end.
defaults:
  - _spatial
  - _self_

arch: cnp           # class to build: cnp | anp | pfn | rcnp | ranp | online_ranp
name: cnp           # run name
num_hidden: 128
dropout: 0.2

# Correlated (x, y) output covariance (false: diagonal Gaussian).
full_cov: false

# Feed-forward sublayer in each attention block.
attn_ffn: false
