# Attentive CNP (deterministic, no latent, no RNN) -> anp.DeterministicModel
# Flat baseline: spatial front end DISABLED here (see model=spatial_cnp).
defaults:
  - _spatial        # shared spatial block (single source of truth, disabled)
  - _self_

arch: cnp           # architecture: what build_model instantiates (cnp|anp|ranp|rcnp|online_ranp)
name: cnp           # display name: unique per config file; used in exp/run/dir naming
num_hidden: 128
dropout: 0.2        # dropout prob for attention + decoder-MLP LayerNorm/dropout
