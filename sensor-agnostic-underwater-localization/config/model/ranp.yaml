# Recurrent latent NP (r_anp.LatentModel).
defaults:
  - _rnn_base
  - _self_

arch: ranp
name: ranp

# Correlated (x, y) output covariance (false: diagonal Gaussian).
full_cov: false

# Feed-forward sublayer in each attention block.
attn_ffn: false

# Pooling of the latent encoder: attention | mean.
latent_pooling: attention
