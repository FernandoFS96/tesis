# Spatial front end (src/models/anp.py, SpatialEncoder), included by the model
# configs; the spatial_* variants set enabled: true. Each point's features are
# split into one token per sensor, tagged with a Fourier encoding of the sensor
# position, mixed by attention across sensors and pooled. Needs the geometry
# split, which provides sensor_pos; n_sensors is read from the data.
#
# Ablations (Appendix A of the paper):
#   model=spatial_cnp model.spatial.tokenize=false        no per-sensor tokens
#   model=spatial_cnp model.spatial.use_position=false    no position encoding
#   model=spatial_cnp model.spatial.use_attention=false   no cross-sensor attention
#   model=spatial_cnp model.spatial.pooling=mean          mean instead of attention pooling

# absolute: labels in the data frame | centroid: relative to the array centroid
frame: absolute
spatial:
  enabled: false
  encoder: legacy        # legacy: SpatialEncoder | set: SensorSetEncoder (set_* keys)
  set_d_model: 256
  set_layers: 6
  set_heads: 8
  set_pos_scale: 100.0
  set_dropout: 0.0
  set_bf16: true
  tokenize: true         # one token per sensor
  use_position: true     # Fourier position features
  use_attention: true    # self-attention across sensors
  pooling: attention     # attention | mean
  norm_acoustic: standardize  # standardize (one global scale) | layernorm (per sensor) | none
  sensor_id_embed: false # learned embedding per sensor slot
  n_attn_layers: 3
  n_fourier_bands: 8
  min_wavelength: 10.0   # meters
  max_wavelength: 1000.0
  pos_dim: 2             # (x, y); all sensors share one depth
