# Prior-data fitted network (pfn.PFNModel), without the spatial front end.
defaults:
  - _spatial
  - _self_

arch: pfn
name: pfn
num_hidden: 128
dropout: 0.1
n_layers: 6
n_heads: 8
ffn_mult: 4         # feed-forward width = ffn_mult * num_hidden

# joint: one stack over [context, target], targets attend to the context only.
# cross: the stack encodes the context; targets read it through cross-attention
#        with queries and keys from the acoustics.
readout: joint
n_cross_layers: 2   # readout=cross only
