# Attentive latent NP (posterior + KL) -> anp.LatentModel
# Flat baseline: spatial front end DISABLED here (see model=spatial_anp).
defaults:
  - _spatial        # shared spatial block (single source of truth, disabled)
  - _self_

arch: anp           # architecture: what build_model instantiates (cnp|anp|ranp|rcnp|online_ranp)
name: anp           # display name: unique per config file; used in exp/run/dir naming
num_hidden: 128
dropout: 0.2        # dropout prob for attention + decoder-MLP LayerNorm/dropout
                    # (matched to cnp.yaml so ANP-vs-CNP differs only in the latent)
