# @package _global_
# ============================================================================
# Experiment: TOPOLOGY task (spiral), one model per sensor topology.
#   python scripts/train/train_np_geometry.py experiment=topology data.topology=random
#   (sweep: data.topology=ellipsoidal|random|aligned ; model=cnp|anp|ranp|...)
# Generate the matching data first:  python data/generate.py dataset=topology_spiral
# ============================================================================
defaults:
  - override /dataset: topology_spiral
  - override /data: topology
  - override /model: anp

exp_name: topology_spiral
training:
  epochs: 2000
  kl_warmup_epochs: 1000
