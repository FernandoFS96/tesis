# @package _global_
# ============================================================================
# Experiment: RANDOM task, held-out sensor layouts (OOD, spiral). These no-
# spatial-encoder baselines are expected to DEGRADE here by construction.
#   python scripts/train/train_np_geometry.py experiment=geometry_ood
# Generate + preprocess first:
#   python data/generate.py dataset=random_spiral_shared
#   python data/data_process_random_positions.py \
#       --data-root data/random_task/spiral_shared --mode geometry
# ============================================================================
defaults:
  - override /dataset: random_spiral_shared
  - override /data: geometry
  - override /model: anp

exp_name: geometry_ood_spiral
training:
  epochs: 2000
  kl_warmup_epochs: 500
