# Weights & Biases logging. Off by default; to use it, log in with your own
# account (`wandb login`) and run with wandb.enabled=true. Leave entity as null
# to log to your default entity, or set it to a team name.
enabled: false
offline: false       # log locally and sync later
project_name: sensor-agnostic-underwater-localization
entity: null
group_name: ${exp_name}
run_name: ${exp_name}_seed_${seed}
dev: false           # tag the run as a development run
tags: null

# Figures logged during training (ignored when enabled is false).
viz:
  enabled: true
  milestones: [5, 10, 25, 50, 100]  # epochs at which to log figures early on
  every_n_epochs: 100               # then every N epochs, plus the last one
  n_trajectories: 4                 # validation trajectories shown in pred_trajectory
  plot_uncertainty: true            # 1-std ellipses on the trajectory plot
  watch_gradients: false            # wandb.watch(model)
  plots:
    pred_trajectory: true
    degradation_scatter: true       # per-geometry MAE vs distance from the training layouts
    calibration: true               # predicted std vs error
    error_histogram: true
    streaming_drift: true           # online_ranp only
