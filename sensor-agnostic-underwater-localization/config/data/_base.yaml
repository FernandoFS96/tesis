# Shared defaults for every data (split) config. 
# Each split file includes this via `defaults: [_base, _self_]` and only sets what differs (data_dir + context.exclude_from_target). 
# Edit shared knobs here, once.

# Target normalisation (zero-mean / unit-std, stats computed on the train set).
normalize_y: true

# Context-set sampling (one block, one concept).
#
# DEPLOYMENT CAUSALITY (real-time acoustic localization, no GPS): the vehicle localizes each point as it arrives, from that point's acoustics + fixes it already has in the PAST. 
# That scenario is faithfully reproduced iff context is a PAST PREFIX of every target, i.e. sample_mode='first' AND exclude_from_target=true (targets = the future complement). 
# With those two, no target can attend a future fix, and the causal LSTM never sees future acoustics. sample_mode='random' or exclude_from_target=false break causality (a target may attend a fix that lies in its future)
# -- use only for non-deployment diagnostics. eval enforces this with --require-causal.
context:
  min: 2               # min context points (random size per train batch)
  max: 40              # max context points
  eval: 10             # fixed context size for validation / evaluation
  sample_mode: first   # 'first': ordered prefix (CAUSAL) | 'random': subset (non-causal)
  # Target-set composition: true -> targets are the COMPLEMENT of the context (non-overlapping; CAUSAL with sample_mode=first); 
  # false -> targets are ALL points (non-causal). Split files override where the task demands it.
  exclude_from_target: true
  # Per-sample context batching. false (default) = ORIGINAL behaviour:
  # one context size is drawn per BATCH and shared by all its samples, so context -size variability is tied to the number of batches (small batch -> more variety but slow).
  # true = each sample in a batch gets its OWN context size (padded + masked), decoupling variability from batch size -> we can raise batch_size for GPU throughput without losing diversity.
  #TRAIN only; validation keeps the fixed `eval` size. 
  # Supported for model=cnp / spatial_cnp only (deterministic split);
  per_sample: true

  # CALIBRATION regime (false = ORIGINAL behaviour, context from the sample's OWN
  # trajectory). true -> context points are drawn from a DIFFERENT trajectory of
  # the SAME (geometry, theta): a separate "calibration transit", the way a
  # GPS-tracked vessel would supply labelled fixes before you localize something
  # else. Targets become ALL points of the sample's own trajectory.
  # WHY: with same-trajectory context the model can score well by extrapolating
  # the revealed prefix of the target's OWN path and ignoring the acoustics --
  # measured, that shortcut accounts for most of a position-free model's score.
  # Cross-trajectory context removes it, so the context can only help by
  # carrying TASK identity (the array geometry). Applies to train AND validation.
  # Supported for model=cnp / spatial_cnp only (needs the padded context mask).
  calibration: false

# Translation augmentation (TRAIN only; 0 disables).
# Max |offset| in METRES for a per-sample rigid 2-D shift of the whole scene: 
# sensor_pos AND y move together, acoustics X stay untouched, exactly valid because the simulated channel depends only on relative source-sensor geometry. 
# Synthesises unlimited displaced layouts along precisely the layout-OOD axis (the extrap penalty lives outside the training hull of array centres). 
# Requires model=spatial_* (errors otherwise). 300 is ~1.5-2x the generation displacement scale so the test hull is over-covered.
trans_aug_m: 150

# Rotation augmentation (TRAIN only): per-sample random rotation and reflection of the whole scene about the array centroid; valid for the same reason as the translation.
# Requires model=spatial_*. Needed by the array-centered front end (model.spatial.encoder=set).
rot_aug: false

# Sensor dropout (TRAIN only), as in the RANP topologies work: each sample gets its own random set of failed sensors, the same for its context and target points (a failed sensor is missing for the whole deployment). Validation keeps every sensor.
# mode: none | bernoulli (each sensor fails with probability p) | k_uniform (number of present sensors uniform in [min_keep, n_sensors]). Requires model=spatial_* (tokenized).
sensor_drop:
  mode: none
  p: 0.3
  min_keep: 3

# Sensor-position error (TRAIN only; 0 disables): each sample draws an sd from U(0, sensor_pos_err_m) metres and adds N(0, sd^2) per sensor and axis to the horizontal positions the model is GIVEN; the labels stay true. One draw per sample, so its context and target points share it (a mis-surveyed array is wrong for the whole deployment), and the context is the only way to see the error. Validation keeps the true positions. Requires model=spatial_*.
sensor_pos_err_m: 0.0

# Streaming granularity for the online model (model=online_ranp); offline ignore.
chunk_size: 8

# Cap the number of TRAINING geometries (null = use all). Only affects the train pool; val/test stay fixed. 
# Keeps the first N distinct geometry_ids (sorted), so 10 subset of 20 subset of 40, for "how many sensor layouts do we need?" sweeps.
max_train_geometries: 140

# Cap the number of TRAINING trajectories / source paths (null = use all). Composes with max_train_geometries so the training set is (first N layouts) x (first M paths).
# Needs data with traj_id (geometry / topology modes).
max_train_trajectories: 350

# Cap the VALIDATION trajectories (null = use all). Set equal to max_train_trajectories to train and validate on the SAME source paths (pure layout-generalization). 
# Removes the train/val path mismatch that inflates the late-epoch overfitting overshoot. Held-out val geometries are untouched; only their trajectories are subsampled.
max_val_trajectories: 350

# Path to a JSON list of geometry ids; restricts TRAINING to those deployments
# only (val/test untouched). null = use everything. Used by the depth-stratified
# study of B2, where the arms differ only in which deployments are trained on.
train_geometry_ids: null
