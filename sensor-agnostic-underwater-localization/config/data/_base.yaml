# Defaults shared by the split configs (each includes this file and sets only
# what differs).

# Normalize the targets with training-set mean and std.
normalize_y: true

# Context sampling. With sample_mode=first and exclude_from_target=true the
# context is the opening of each transit and the targets are the rest, so no
# target can use a later fix.
context:
  min: 2               # context size range in training (drawn per batch or per sample)
  max: 40
  eval: 10             # fixed context size for validation and evaluation
  sample_mode: first   # first: opening of the transit | random: random subset
  exclude_from_target: true   # true: targets are the points not in the context
  # Draw the context size per sample instead of per batch (padded and masked).
  # Training only; split models (cnp / anp / pfn) only.
  per_sample: true
  # Calibration regime: the context comes from another trajectory of the same
  # deployment, and the targets are all points of the sample's own trajectory.
  # Applies to training and validation.
  calibration: false

# Translation augmentation (training only): maximum shift in meters of the whole
# scene (sensor positions and labels together). The acoustic features stay valid
# because the channel depends only on the relative source-sensor geometry.
# Spatial models only; 0 disables it.
trans_aug_m: 150

# Rotation augmentation (training only): random rotation and reflection of the
# scene about the array centroid. Spatial models only.
rot_aug: false

# Sensor dropout (training only): each sample gets its own set of missing
# sensors, shared by its context and targets. Spatial models only.
#   mode: none | bernoulli (each sensor missing with probability p)
#         | k_uniform (number of present sensors uniform in [min_keep, n_sensors])
sensor_drop:
  mode: none
  p: 0.3
  min_keep: 3

# Sensor-position error (training only): each sample draws an sd from
# U(0, sensor_pos_err_m) meters and perturbs the horizontal sensor positions the
# model receives (the labels stay exact). Spatial models only; 0 disables it.
sensor_pos_err_m: 0.0

# Chunk size of the online model (model=online_ranp).
chunk_size: 8

# Optional caps on the training data (null uses everything). The first N
# geometry ids and the first M trajectory ids are kept, so smaller sets are nested.
max_train_geometries: 140
max_train_trajectories: 350
# Optional cap on the validation trajectories.
max_val_trajectories: 350

# Optional JSON list of geometry ids to train on (validation and test unchanged).
train_geometry_ids: null
