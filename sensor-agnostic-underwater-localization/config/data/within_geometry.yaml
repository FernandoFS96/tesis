# RANDOM task -- within-geometry split (every layout seen in training; val/test
# are new trajectories of seen layouts). Reproduces the old converging setup.
# data_dir is derived from the composed `dataset` identity (method + mode).
# exclude_ctx_from_target=false -> targets are ALL points (the old convention).
defaults:
  - _base
  - _self_

data_dir: data/random_task/${dataset.method}_${dataset.mode}/processed/within_geometry_split
exclude_ctx_from_target: false
