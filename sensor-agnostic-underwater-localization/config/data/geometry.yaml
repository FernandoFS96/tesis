# Geometry-split dataset and context-sampling configuration.
data_dir: ../../data/data_random_positions/processed/geometry_split

# Target normalisation (zero-mean / unit-std, stats computed on the train set).
normalize_y: false

# Context-set sampling.
ctx_min: 5            # min number of context points (random mode, train)
ctx_max: 40           # max number of context points (random mode, train)
val_ctx: 20           # fixed number of context points used for validation
ctx_sample_mode: random   # 'first': ordered prefix context | 'random': random subset
