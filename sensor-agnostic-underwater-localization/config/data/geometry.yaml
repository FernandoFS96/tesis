# RANDOM task -- held-out sensor-layout split (OOD). data_dir is derived from
# the composed `dataset` identity (method + mode), so it always matches what
# `generate.py dataset=<same>` produced. Baselines with no spatial encoder are
# expected to degrade here (this is the gap a spatial encoder would close).
defaults:
  - _base
  - _self_

data_dir: data/random_task/${dataset.method}_${dataset.mode}/processed/geometry_split
exclude_ctx_from_target: true
