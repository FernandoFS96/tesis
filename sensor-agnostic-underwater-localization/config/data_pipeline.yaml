# Data generation and preprocessing (plain OmegaConf, read by data/generate.py
# and data/process_data.py).
#
#   python data/generate.py dataset=random_hermite_distinct
#   python data/generate.py dataset=topology_spiral
#   python data/generate.py dataset=random_hermite_shared channel.df=100 \
#       random_task.n_position_sets=5
#
# Two tasks share the trajectory method, the channel settings and the
# trajectory parameters:
#   topology  three array topologies (ellipsoidal / random / aligned) with the
#             same trajectories and channels
#   random    many random sensor layouts; the trajectories are shared by all
#             layouts or drawn separately for each (distinct_trajectories)

task: random            # topology | random

# Trajectory shape: spiral | hermite (see _generate_<method>_trajectories in
# data/acoustic_data_generator.py).
method: hermite

channel:
  channel_options: [0.1, 0.2]  # theta values (small-scale channel variability)
  n_traj: 400        # trajectories per theta (and per position set or topology)
  ppt: 50            # points per trajectory
  df: 50.0           # frequency resolution [Hz]; feature dim = (B/df + 1) * n_sensors
  snr: 10.0          # SNR [dB] of the filtered features
  rep: 1             # filtering repetitions
  master_seed: 11
  nop: -1            # joblib processes (-1: all cores)

  # Signal model. The defaults give the single-tone records used in the paper.
  # With absolute_delay the arrival-time differences between sensors are kept;
  # delays are then unambiguous only for ranges below c/df.
  signal_type: sinusoid   # sinusoid | chirp | sinusoid_cav
  absolute_delay: false   # keep the absolute time of flight
  matched_filter: false   # correlate the record with the transmitted probe
  save_channel_h: true    # also save the raw channel responses (channel_h_*.npy)
  signal_n: 1024          # probe length [samples], at least 2 * (B/df + 1)
  B: null                 # bandwidth [Hz]; null keeps 10000
  chirp_band: null        # [f0, f1] in normalized frequency; null uses [0.02, 0.45]

spiral:
  radio_min: 250.0    # radius scale [m]
  radio_max: 350.0
  omega_min: 0.8      # angular speed
  omega_max: 2.5
  angle_span: 1.4     # angle spans [0, angle_span * ppt]
  radius_start: 0.2   # radius spans [radius_start * ppt, radius_end * ppt]
  radius_end: 1.4

# Piecewise cubic Hermite trajectories: n_segments segments joined with C1
# continuity; each knot direction turns at most max_turn from the previous one.
hermite:
  n_segments: 3
  seg_len_min: 80.0   # segment chord length [m]
  seg_len_max: 250.0
  max_turn: 1.2       # [rad]
  tension: 0.8        # scale of the knot tangents
  start_radius_min: 30.0  # distance of the start point from the origin [m]
  start_radius_max: 80.0
  # Optional constant speed [m/s] per trajectory, drawn from U(speed_min,
  # speed_max); the trajectory is re-parameterized by arc length. null keeps the
  # speed implied by the segment lengths.
  speed_min: null
  speed_max: null

# Topology task (data/acoustic_data_generator.py). Output:
#   <out_dir>/<method>/<topology>/channel_option_<theta>/...
topology_task:
  topologies: [ellipsoidal, random, aligned]
  out_dir: ./data/topology_task

# Random-layout task (data/random_position_generator.py). Output:
#   <out_dir>/<method>_<mode>/position_set_<p>/channel_option_<theta>/random/...
random_task:
  n_position_sets: 200          # number of deployments
  distinct_trajectories: true   # false: one trajectory ensemble for all deployments
  traj_seed_offset: 2000        # trajectory seed = master_seed + offset + p
  out_dir: ./data/random_task
  # Optional range of deployments to generate, to split a run into parallel
  # shards; null generates all of them.
  start_set: null
  end_set: null
  # Each deployment places a compact array whose center is shifted by a random
  # offset. Sizes are fractions of the trajectory field's extent.
  layout:
    aperture_frac: 0.5   # array span
    offset_frac: 0.3     # maximum shift of the array center
    scale_jitter: 0.0    # relative jitter of the aperture
    min_span: 20.0       # minimum array span [m]
    fixed_seed: null     # an int pins one array for every deployment
  # Optional propagation environment drawn per deployment; each value is a
  # [lo, hi] range (lo == hi fixes it). Disabled, the channel defaults are used.
  environment:
    enabled: false
    env_seed_offset: 3000
    h0:      [30.0, 120.0]     # water depth [m]
    ht_frac: [1.0, 1.0]        # transmitter height as a fraction of depth (1: surface)
    hr0:     [1.0, 5.0]        # receiver height above the bottom [m]
    c:       [1470.0, 1540.0]  # sound speed in water [m/s]
    c2_frac: [0.70, 0.95]      # bottom sound speed as a fraction of c (must be < 1)
    k:       [1.4, 2.0]        # spreading factor

# Preprocessing (data/process_data.py); command line flags override these.
#   mode: topology (topology task, split by trajectory)
#         legacy   (random task, split within each layout)
#         geometry (random task, held-out layouts)
#         all      (geometry and legacy)
preprocess:
  mode: geometry
  method: ${method}
  data_root: ./data/random_task/hermite_distinct
  save_dir: null            # null: <data_root>/processed
  thetas: null              # null: all; or e.g. [0.1, 0.2]

  # Topology mode: trajectory split (ratios, rescaled to n_traj).
  topology_split:
    n_train: 70
    n_val: 20
    n_test: 10
    seed: 0

  # Geometry mode: number of layouts per pool (summing to n_position_sets).
  geometry_split:
    n_train: 140
    n_val: 40
    n_test: 20
